<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOXX 600 Sentiment Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand { color: #fff !important; font-weight: 700; letter-spacing: 0.5px; }
    .badge-buy     { background: #198754; color: #fff; }
    .badge-sell    { background: #dc3545; color: #fff; }
    .badge-neutral { background: #ffc107; color: #212529; }
    .badge-error   { background: #6c757d; color: #fff; }
    .badge-unprocessed { background: #dee2e6; color: #6c757d; }
    .signal-badge { font-size: .8rem; padding: .3em .7em; border-radius: 999px; font-weight: 600; }
    .table th { white-space: nowrap; font-size: .85rem; }
    .table td { font-size: .85rem; vertical-align: middle; }
    .headline-cell { max-width: 520px; }
    .filter-card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    #progressWrap { display: none; }
    .reasoning-tip { cursor: help; border-bottom: 1px dashed #aaa; }
    #uploadZone {
      border: 2px dashed #adb5bd;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #uploadZone:hover, #uploadZone.drag-over { border-color: #0d6efd; background: #f0f4ff; }
    #uploadZone i { font-size: 2.5rem; color: #adb5bd; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand"><i class="bi bi-graph-up-arrow me-2"></i>STOXX 600 Sentiment Analyzer</span>
  <button class="btn btn-outline-light btn-sm" onclick="openSettings()">
    <i class="bi bi-gear me-1"></i>Settings
  </button>
</nav>

<div class="container-fluid py-3 px-4">

  <!-- Upload area (shown when no file loaded) -->
  <div id="uploadSection" class="mb-3">
    <div class="card filter-card">
      <div class="card-body">
        <h6 class="card-title mb-3"><i class="bi bi-cloud-upload me-2 text-primary"></i>Load your news database</h6>
        <div id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <i class="bi bi-file-earmark-spreadsheet d-block mb-2"></i>
          <div class="fw-semibold">Click to upload CSV or Excel file</div>
          <div class="text-muted small mt-1">or drag and drop here</div>
        </div>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" class="d-none" onchange="handleFileUpload(event)">
        <div id="uploadStatus" class="mt-2 small text-muted"></div>
      </div>
    </div>
  </div>

  <!-- Loaded file indicator -->
  <div id="fileInfo" class="alert alert-success d-none py-2 mb-3">
    <i class="bi bi-check-circle me-2"></i>
    <span id="fileInfoName"></span>
    <button class="btn btn-sm btn-outline-secondary ms-3" onclick="document.getElementById('fileInput').click()">
      Change file
    </button>
  </div>

  <!-- Filter panel -->
  <div class="card filter-card mb-3" id="filterSection" style="display:none!important">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-sm-3">
          <label class="form-label small mb-1">Ticker / Company</label>
          <input type="text" id="fTicker" class="form-control form-control-sm" placeholder="e.g. ASML">
        </div>
        <div class="col-sm-2">
          <label class="form-label small mb-1">Date from</label>
          <input type="date" id="fDateFrom" class="form-control form-control-sm">
        </div>
        <div class="col-sm-2">
          <label class="form-label small mb-1">Date to</label>
          <input type="date" id="fDateTo" class="form-control form-control-sm">
        </div>
        <div class="col-sm-2">
          <label class="form-label small mb-1">Source</label>
          <select id="fSource" class="form-select form-select-sm">
            <option value="all">All sources</option>
          </select>
        </div>
        <div class="col-sm-2">
          <label class="form-label small mb-1">Signal</label>
          <select id="fSignal" class="form-select form-select-sm">
            <option value="all">All</option>
            <option value="buy">Buy</option>
            <option value="neutral">Neutral</option>
            <option value="sell">Sell</option>
            <option value="unprocessed">Unprocessed</option>
            <option value="error">Error</option>
          </select>
        </div>
        <div class="col-sm-1">
          <button class="btn btn-primary btn-sm w-100" onclick="applyFilters()">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Action bar -->
  <div id="actionBar" class="d-none mb-3">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <span id="statsText" class="text-muted small"></span>
      <button class="btn btn-sm btn-success" id="btnProcessUnprocessed" onclick="startProcessing('unprocessed')">
        <i class="bi bi-cpu me-1"></i>Run AI on unprocessed
      </button>
      <button class="btn btn-sm btn-outline-success" onclick="startProcessing('filtered')">
        <i class="bi bi-funnel me-1"></i>Run AI on filtered view
      </button>
      <button class="btn btn-sm btn-outline-secondary" onclick="exportCSV()">
        <i class="bi bi-download me-1"></i>Export CSV
      </button>
    </div>
    <!-- Progress bar -->
    <div id="progressWrap" class="mt-2">
      <div class="d-flex align-items-center gap-2">
        <div class="progress flex-grow-1" style="height:10px">
          <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success"
               style="width:0%"></div>
        </div>
        <span id="progressText" class="small text-muted" style="white-space:nowrap"></span>
        <button class="btn btn-sm btn-outline-danger" onclick="stopProcessing()">Stop</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card filter-card" id="tableSection" style="display:none!important">
    <div class="card-body p-0">
      <table class="table table-hover mb-0" id="mainTable">
        <thead class="table-light">
          <tr>
            <th>Headline</th>
            <th>Ticker</th>
            <th>Date</th>
            <th>Source</th>
            <th>Signal</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="card-footer d-flex align-items-center justify-content-between py-2">
      <span id="pageInfo" class="small text-muted"></span>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
      </nav>
    </div>
  </div>

</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-gear me-2"></i>Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Anthropic API Key</label>
          <div class="input-group">
            <input type="password" id="apiKeyInput" class="form-control" placeholder="sk-ant-...">
            <button class="btn btn-outline-secondary" type="button" onclick="toggleApiKeyVisibility()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div class="form-text">Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Model</label>
          <select id="modelSelect" class="form-select">
            <option value="claude-haiku-4-5">claude-haiku-4-5 (fast, cheap — recommended for bulk)</option>
            <option value="claude-sonnet-4-6">claude-sonnet-4-6 (higher quality, slower)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Column Mapping Modal -->
<div class="modal fade" id="mappingModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-table me-2"></i>Map your columns</h5>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Tell us which column in your file corresponds to each field.</p>
        <div class="mb-3">
          <label class="form-label">Headline text <span class="text-danger">*</span></label>
          <select id="mapHeadline" class="form-select form-select-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Ticker / Company <span class="text-danger">*</span></label>
          <select id="mapTicker" class="form-select form-select-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Date</label>
          <select id="mapDate" class="form-select form-select-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Source / Publisher</label>
          <select id="mapSource" class="form-select form-select-sm"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveMapping()">Load data</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
